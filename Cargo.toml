[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Stratocaster-Ventures/stellar-jev-policies"

[workspace.dependencies]
soroban-sdk = "28.0.0"
# crates.io stellar-accounts 0.7.2 depends on soroban-sdk 26.1 (incompatible with 28).
# OZ v0.7.3 tag (release-v0.7.3 branch) is still on soroban-sdk 26.1. OZ main @8e25220
# is on soroban-sdk 28.0.0 and carries the same v0.7.3 security fix (delegated-signer
# guard, SmartAccountError::DelegatedSignerCycle 3017), so we pin that commit.
stellar-accounts = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "8e25220" }
ed25519-dalek = "2.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
