[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "28.0.0"
# crates.io stellar-accounts 0.7.2 depends on soroban-sdk 26.1 (incompatible with 28).
# OZ main @33b665b is on soroban-sdk 28.0.0, so we pin that commit.
stellar-accounts = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "33b665b" }
ed25519-dalek = "2.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
