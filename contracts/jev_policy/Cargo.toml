[package]
name = "jev_policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-accounts = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true }
jev_verifier = { path = "../jev_verifier" }
oz_smart_account = { path = "../oz_smart_account" }
oz_ed25519_verifier = { path = "../oz_ed25519_verifier" }
oz_spending_limit = { path = "../oz_spending_limit" }
oz_simple_threshold = { path = "../oz_simple_threshold" }
